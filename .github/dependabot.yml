# Weekly update PRs into dev. They go through the same required checks as any
# other PR and ship with the next release; see CLAUDE.md for how to review them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    ignore:
      # The Expo SDK pins these. They move with `npx expo install --fix` when
      # the SDK is upgraded, not one by one.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "jest-expo"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-masked-view/masked-view"
      - dependency-name: "@stripe/stripe-react-native"
      # @types/node follows the Node version in CI: a newer major types APIs
      # that version doesn't have. Drop this when CI moves up.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for every minor and patch bump; majors come one per package so
      # their breaking changes can be reviewed on their own.
      production-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
