name: E2E

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      flows:
        description: Flows to run
        type: choice
        options: [smoke, all]
        default: smoke

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Maestro flows against a Release build on an Android emulator. They use the
  # production API with the dedicated test users and product. Not a required check.
  e2e-android:
    name: e2e-android
    # Pull requests from forks get no secrets, so they can't build the app
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_NAME: ${{ vars.APP_NAME }}
      UNIQUE_IDENTIFIER: ${{ vars.UNIQUE_IDENTIFIER }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      # Maestro reads every environment variable that starts with MAESTRO_
      MAESTRO_APP_ID: ${{ vars.UNIQUE_IDENTIFIER }}
      MAESTRO_EMAIL: ${{ vars.MAESTRO_EMAIL }}
      MAESTRO_PASSWORD: ${{ secrets.MAESTRO_PASSWORD }}
      MAESTRO_OTHER_EMAIL: ${{ vars.MAESTRO_OTHER_EMAIL }}
      MAESTRO_OTHER_PASSWORD: ${{ secrets.MAESTRO_OTHER_PASSWORD }}
      MAESTRO_PRODUCT_ID: ${{ vars.MAESTRO_PRODUCT_ID }}
      MAESTRO_PRODUCT_TITLE: ${{ vars.MAESTRO_PRODUCT_TITLE }}
      MAESTRO_PRODUCT_PRICE: ${{ vars.MAESTRO_PRODUCT_PRICE }}
      MAESTRO_ORDER_QUANTITY: ${{ vars.MAESTRO_ORDER_QUANTITY }}
      MAESTRO_EXPECTED_SUBTOTAL: ${{ vars.MAESTRO_EXPECTED_SUBTOTAL }}
      MAESTRO_EXPECTED_TAXES: ${{ vars.MAESTRO_EXPECTED_TAXES }}
      MAESTRO_EXPECTED_TOTAL: ${{ vars.MAESTRO_EXPECTED_TOTAL }}
      MAESTRO_CARD_NUMBER: ${{ vars.MAESTRO_CARD_NUMBER }}
      MAESTRO_CARD_EXPIRY: ${{ vars.MAESTRO_CARD_EXPIRY }}
      MAESTRO_CARD_CVC: ${{ vars.MAESTRO_CARD_CVC }}
    steps:
      - uses: actions/checkout@v7

      # Hardware acceleration for the emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - run: yarn install --frozen-lockfile

      # Only the emulator's ABI, which halves the native build
      - name: Build the Release APK
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION=2.12.1 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # smoke on every pull request into dev; every flow into main or when asked
      - name: Choose the flows
        env:
          BASE_REF: ${{ github.base_ref }}
          FLOWS_INPUT: ${{ inputs.flows }}
        run: |
          if [ "$BASE_REF" = "main" ] || [ "$FLOWS_INPUT" = "all" ]; then
            echo "MAESTRO_TAGS=" >> "$GITHUB_ENV"
          else
            echo "MAESTRO_TAGS=--include-tags smoke" >> "$GITHUB_ENV"
          fi

      # The runner runs each script line as its own command
      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro $MAESTRO_TAGS --format junit --output maestro-report.xml --debug-output maestro-results

      - name: Upload the report and the results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android
          path: |
            maestro-report.xml
            maestro-results/
          retention-days: 14
