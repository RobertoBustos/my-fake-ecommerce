appId: ${MAESTRO_APP_ID}
tags:
  - smoke
---
# The link a push notification opens: myapp://orders/<id> shows that order, paid. The API
# only returns a user's own orders, so MAESTRO_ORDER_ID is a paid order of the test user.
- runFlow: ../subflows/launch-clean.yaml
- extendedWaitUntil:
    visible:
      id: "Catalog.Container"
    timeout: 30000
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_EMAIL}
      PASSWORD: ${MAESTRO_PASSWORD}
- openLink: myapp://orders/${MAESTRO_ORDER_ID}
# iOS 26 asks first whether to open the link in the app, the first time on each simulator
# (iOS 18 and 27 don't). The dialog follows the device language: English in CI, Spanish on
# a simulator set to Spanish. In CI the iOS job accepts it before the flows
# (setup/accept-open-link.yaml), because Xcode 26's simctl waits for the answer
- extendedWaitUntil:
    visible: "(Open in|¿Abrir en) .*|Order Number .*"
    timeout: 20000
- runFlow:
    when:
      visible: "(Open in|¿Abrir en) .*"
    commands:
      - tapOn: "Open|Abrir"
- extendedWaitUntil:
    visible:
      id: "ConfirmationScreen.Layout"
    timeout: 20000
# The order loaded: its number in the header and its products
- assertVisible: "Order Number ${MAESTRO_ORDER_ID}"
- extendedWaitUntil:
    visible:
      id: "Confirmation.Container"
    timeout: 20000
# Back to the catalog, and leave the test user signed out
- tapOn:
    id: "ConfirmationScreen.Footer"
- extendedWaitUntil:
    visible:
      id: "Catalog.Container"
    timeout: 20000
- runFlow: ../subflows/sign-out.yaml
