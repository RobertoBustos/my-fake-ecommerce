appId: ${MAESTRO_APP_ID}
tags:
  - main
---
# The test product shows the expected title and price in the catalog and in its detail
- runScript: ../scripts/expected.js
- runFlow: ../subflows/launch-clean.yaml
- extendedWaitUntil:
    visible:
      id: "Catalog.Container"
    timeout: 30000
# The test product can be the last card, and scrolling stops as soon as part of it shows.
# The price is the card's lowest text, so once it shows the title above it does too. A
# visibility percentage of the card doesn't help: on Android Maestro reads the bounds of
# the part on screen, so a card cut off at the bottom edge counts as fully visible.
- scrollUntilVisible:
    element:
      id: "CatalogItemCard.Price-${MAESTRO_PRODUCT_ID}"
    direction: DOWN
    timeout: 120000
    visibilityPercentage: 100
- assertVisible:
    id: "CatalogItemCard.Title-${MAESTRO_PRODUCT_ID}"
    text: ${output.expected.title}
- assertVisible:
    id: "CatalogItemCard.Price-${MAESTRO_PRODUCT_ID}"
    text: ${output.expected.price}
- tapOn:
    id: "CatalogItemCard.Title-${MAESTRO_PRODUCT_ID}"
- extendedWaitUntil:
    visible:
      id: "Product.Title"
      text: ${output.expected.title}
    timeout: 15000
- assertVisible:
    id: "Product.Price"
    text: ${output.expected.price}
# The stock changes with every purchase, so only that it is shown
- assertVisible:
    id: "Product.Stock"
# Quantity: up and back down to the minimum
- assertVisible:
    id: "QuantityButtons.Quantity"
    text: "1"
- tapOn:
    id: "QuantityButtons.Increment"
- assertVisible:
    id: "QuantityButtons.Quantity"
    text: "2"
- tapOn:
    id: "QuantityButtons.Decrement"
- assertVisible:
    id: "QuantityButtons.Quantity"
    text: "1"
