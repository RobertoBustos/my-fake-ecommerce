appId: ${MAESTRO_APP_ID}
tags:
  - smoke
---
- runFlow: ../subflows/launch-clean.yaml
# The anonymous session and the first page of the catalog; the API can take a few seconds on a cold start
- extendedWaitUntil:
    visible:
      id: "Catalog.Container"
    timeout: 30000
- assertVisible: "Products"
- assertVisible:
    id: "CatalogItemCard\\.CardContainer-.*"
# Temporary: forces a failure to check the artifacts of the e2e job
- assertVisible: "This text is never shown"
