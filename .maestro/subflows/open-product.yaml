appId: ${MAESTRO_APP_ID}
---
# From the catalog: scroll (loading more pages) until the test product shows, and open it
- extendedWaitUntil:
    visible:
      id: "Catalog.Container"
    timeout: 30000
# The test product can be the last card, and scrolling stops as soon as part of it shows.
# The price is the card's lowest text, so once it shows the title above it does too. A
# visibility percentage of the card doesn't help: on Android Maestro reads the bounds of
# the part on screen, so a card cut off at the bottom edge counts as fully visible.
- scrollUntilVisible:
    element:
      id: "CatalogItemCard.Price-${MAESTRO_PRODUCT_ID}"
    direction: DOWN
    timeout: 120000
    visibilityPercentage: 100
- tapOn:
    id: "CatalogItemCard.Title-${MAESTRO_PRODUCT_ID}"
- extendedWaitUntil:
    visible:
      id: "Product.Title"
    timeout: 15000
