appId: ${MAESTRO_APP_ID}
---
# From the catalog: scroll (loading more pages) until the test product shows, and open it
- extendedWaitUntil:
    visible:
      id: "Catalog.Container"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "CatalogItemCard.CardContainer-${MAESTRO_PRODUCT_ID}"
    direction: DOWN
    timeout: 120000
    # The test product can be the last card. Scrolling stops as soon as part of it shows,
    # which can leave its title under the bottom edge, so the whole card is brought into view
    visibilityPercentage: 100
# On Android the list can still move after the scroll ends and leave the card under the
# bottom edge again, so once it settles the same scroll brings it back if needed
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "CatalogItemCard.CardContainer-${MAESTRO_PRODUCT_ID}"
    direction: DOWN
    visibilityPercentage: 100
- tapOn:
    id: "CatalogItemCard.Title-${MAESTRO_PRODUCT_ID}"
- extendedWaitUntil:
    visible:
      id: "Product.Title"
    timeout: 15000
