appId: ${MAESTRO_APP_ID}
---
# Paying asks first whether to get notified, unless the permission is already decided.
# launch-clean denies notifications, but Maestro's permissions don't apply on every iOS
# version (not on iOS 27) and Android lets the app ask again, so it can still show
- runFlow:
    when:
      visible: "Get notified when your payment is confirmed"
    commands:
      - tapOn: "Not now"
# Stripe's Payment Sheet is native and has no test ids, so its fields are found by their
# labels. On Android the sheet follows the device language, so English and Spanish are
# both accepted; on iOS it is always in English, because the app is not localized.
# After each field the sheet moves the focus to the next one by itself. On iOS the card
# number's label goes on with the supported brands ("Card number. Supported cards include…").
- extendedWaitUntil:
    visible: "(Card number|Número de tarjeta).*"
    timeout: 30000
- tapOn: "(Card number|Número de tarjeta).*"
- inputText: ${MAESTRO_CARD_NUMBER}
- inputText: ${MAESTRO_CARD_EXPIRY}
- inputText: ${MAESTRO_CARD_CVC}
# The billing country comes from the device region: for the United States the sheet asks
# for a ZIP code, for Mexico it doesn't
- runFlow:
    when:
      visible: "ZIP Code|ZIP|Código postal"
    commands:
      - tapOn: "ZIP Code|ZIP|Código postal"
      - inputText: "42424"
# On iOS the number pad covers the pay button. Tapping a label of the sheet closes it; the
# pad's Done key is gone on iOS 27, which shows an unlabeled check button instead. On
# Android the button stays above the keyboard, and hideKeyboard would close the sheet as
# Back does.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Card information"
# The button shows the amount ("Pay $23.20", or "Pay MX$23.20" with a Mexican locale),
# which doesn't match "Pay with Link"
- tapOn: "Pay (MX)?\\$.*"
