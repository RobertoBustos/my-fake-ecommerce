appId: ${MAESTRO_APP_ID}
---
# Signs in with EMAIL and PASSWORD (passed with runFlow env) from the catalog.
# Run it with an empty cart: with items, the app first warns that they are lost.
- tapOn:
    id: "NavigationHeader.Login"
- tapOn:
    id: "LoginScreen.EmailInput"
- inputText: ${EMAIL}
- pressKey: Enter
- tapOn:
    id: "LoginScreen.PasswordInput"
- inputText: ${PASSWORD}
# Enter would already submit the form; the footer button rises above the keyboard
- tapOn:
    id: "LoginScreen.Footer"
# The iOS 27 simulator offers to save the password after signing in, and its dialog hides the
# app from Maestro until it's closed. Other devices don't ask, so the wait is optional and short
- extendedWaitUntil:
    visible: "(?i)(Not Now|Ahora no)"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "(?i)(Not Now|Ahora no)"
    commands:
      - tapOn: "(?i)(Not Now|Ahora no)"
- extendedWaitUntil:
    visible:
      id: "NavigationHeader.SignOut"
    timeout: 20000
